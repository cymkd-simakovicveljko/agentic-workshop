<svg data-theme="dark" data-course-export="compact-readable" viewBox="0 0 440 760" width="440" height="760" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; }
  .bg { fill: #020617; }
  .grid { stroke: #122033; stroke-width: 1; }
  .frame { fill: rgba(8, 20, 36, .62); stroke: #28405d; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .frame-label { fill: #8aa2b4; font-size: 12px; font-weight: 650; letter-spacing: .04em; }
  .node { stroke-width: 2.2; }
  .node-title { fill: #f8fafc; font-size: 18px; font-weight: 700; text-anchor: middle; }
  .node-sub { fill: #b7c6d8; font-size: 14px; text-anchor: middle; }
  .node-tag { fill: #5eead4; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .edge { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .edge-emphasis { stroke: #2dd4bf; stroke-width: 2.8; }
  .edge-dashed { stroke: #c4b5fd; stroke-dasharray: 7 5; }
  .edge-label { fill: #d7e2ef; font-size: 15px; font-weight: 650; text-anchor: middle; paint-order: stroke; stroke: #020617; stroke-width: 7px; stroke-linejoin: round; }
  .edge-label-emphasis { fill: #5eead4; }
  .edge-label-warning { fill: #fdba74; }
</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" class="grid" fill="none"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="arrow-emphasis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c4b5fd"/></marker></defs><title id="title">What Reaches the Model Context</title><desc id="desc">Human instructions and selected files reach assembled context; untouched filesystem content does not. Retrieved material is untrusted data. Tool results return to the model for human review.</desc><rect width="100%" height="100%" class="bg"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="12" y="28" class="frame-label">SUPPLIED CONTEXT, NOT THE WHOLE DISK</text><path data-edge-from="request" data-edge-to="context" data-edge-label="" d="M135 210H155" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="filesystem" data-edge-to="context" data-edge-label="" d="M135 390H145V230H155" class="edge" marker-end="url(#arrow)"/><path data-edge-from="untrusted" data-edge-to="context" data-edge-label="" d="M305 390H290V225H280" class="edge" marker-end="url(#arrow)"/><path data-edge-from="context" data-edge-to="model" data-edge-label="" d="M217 250V500" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="model" data-edge-to="tools" data-edge-label="" d="M217 580V630" class="edge" marker-end="url(#arrow)"/><path data-edge-from="tools" data-edge-to="model" data-edge-label="tool result" d="M155 670H145V540H155" class="edge" marker-end="url(#arrow)"/><text x="94" y="600" class="edge-label">tool result</text><path data-edge-from="model" data-edge-to="answer" data-edge-label="" d="M280 540H305" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="answer" data-edge-to="review" data-edge-label="" d="M362 580V650" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="review" data-edge-to="context" data-edge-label="revise" d="M362 730V748H4V125H217V170" class="edge edge-dashed" marker-end="url(#arrow-dashed)"/><text x="210" y="110" class="edge-label">revise</text><g id="node-request" data-node-id="request" data-node-label="Human task" data-node-kind="external" role="group"><rect x="10" y="170" width="125" height="80" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="72.5" y="199" class="node-title">Human task</text><text x="72.5" y="219" class="node-sub">goal + rules</text></g><g id="node-filesystem" data-node-id="filesystem" data-node-label="Filesystem" data-node-kind="database" role="group"><rect x="10" y="350" width="125" height="80" rx="8" fill="#241d45" stroke="#c4b5fd" class="node"/><text x="72.5" y="379" class="node-title">Filesystem</text><text x="72.5" y="399" class="node-sub">not all read</text><text x="72.5" y="414" class="node-tag">untouched</text></g><g id="node-context" data-node-id="context" data-node-label="Context" data-node-kind="backend" role="group"><rect x="155" y="170" width="125" height="80" rx="8" fill="#092c2e" stroke="#5eead4" class="node"/><text x="217.5" y="199" class="node-title">Context</text><text x="217.5" y="219" class="node-sub">selected material</text><text x="217.5" y="234" class="node-tag">prompt-visible</text></g><g id="node-untrusted" data-node-id="untrusted" data-node-label="Web / body" data-node-kind="warning" role="group"><rect x="305" y="350" width="115" height="80" rx="8" fill="#3a2018" stroke="#fb923c" class="node"/><text x="362.5" y="379" class="node-title">Web / body</text><text x="362.5" y="399" class="node-sub">retrieved text</text><text x="362.5" y="414" class="node-tag">untrusted</text></g><g id="node-model" data-node-id="model" data-node-label="Model" data-node-kind="cloud" role="group"><rect x="155" y="500" width="125" height="80" rx="8" fill="#332514" stroke="#fcd34d" class="node"/><text x="217.5" y="529" class="node-title">Model</text><text x="217.5" y="549" class="node-sub">uses context</text></g><g id="node-tools" data-node-id="tools" data-node-label="Tools" data-node-kind="messagebus" role="group"><rect x="155" y="630" width="125" height="80" rx="8" fill="#38211c" stroke="#fdba74" class="node"/><text x="217.5" y="659" class="node-title">Tools</text><text x="217.5" y="679" class="node-sub">permitted work</text></g><g id="node-answer" data-node-id="answer" data-node-label="Draft" data-node-kind="backend" role="group"><rect x="305" y="500" width="115" height="80" rx="8" fill="#092c2e" stroke="#5eead4" class="node"/><text x="362.5" y="529" class="node-title">Draft</text><text x="362.5" y="549" class="node-sub">+ evidence</text></g><g id="node-review" data-node-id="review" data-node-label="Review" data-node-kind="external" role="group"><rect x="305" y="650" width="115" height="80" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="362.5" y="679" class="node-title">Review</text><text x="362.5" y="699" class="node-sub">human decision</text></g></svg>