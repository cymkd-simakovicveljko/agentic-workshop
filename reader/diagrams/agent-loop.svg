</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" class="grid" fill="none"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="arrow-emphasis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c4b5fd"/></marker></defs><title id="title">The Agent Loop</title><desc id="desc">A human defines the goal; OMP assembles context and executes permitted requests; the model proposes calls or replies; tools return results; a human verifies or revises.</desc><rect width="100%" height="100%" class="bg"/><rect width="100%" height="100%" fill="url(#grid)"/><path data-edge-from="human" data-edge-to="omp" data-edge-label="" d="M128 235H154" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="omp" data-edge-to="model" data-edge-label="context" d="M209 200V160H348V145" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><text x="268" y="184" class="edge-label edge-label-emphasis">context</text><path data-edge-from="model" data-edge-to="omp" data-edge-label="call / reply" d="M292 110H140V220H154" class="edge" marker-end="url(#arrow)"/><text x="215" y="98" class="edge-label">call / reply</text><path data-edge-from="omp" data-edge-to="tools" data-edge-label="" d="M240 270V440H348V425" class="edge" marker-end="url(#arrow)"/><path data-edge-from="tools" data-edge-to="omp" data-edge-label="result" d="M292 390H275V250H264" class="edge" marker-end="url(#arrow)"/><text x="300" y="334" class="edge-label">result</text><path data-edge-from="omp" data-edge-to="review" data-edge-label="" d="M264 235H292" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="review" data-edge-to="omp" data-edge-label="verify / revise" d="M348 270V308H209V270" class="edge edge-dashed" marker-end="url(#arrow-dashed)"/><text x="208" y="332" class="edge-label">verify / revise</text><g id="node-human" data-node-id="human" data-node-label="Human" data-node-kind="external" role="group"><rect x="16" y="200" width="112" height="70" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="72" y="229" class="node-title">Human</text><text x="72" y="249" class="node-sub">goal</text></g><g id="node-omp" data-node-id="omp" data-node-label="OMP" data-node-kind="backend" role="group"><rect x="154" y="200" width="110" height="70" rx="8" fill="#092c2e" stroke="#5eead4" class="node"/><text x="209" y="229" class="node-title">OMP</text><text x="209" y="249" class="node-sub">assemble + run</text><text x="209" y="264" class="node-tag">harness</text></g><g id="node-model" data-node-id="model" data-node-label="Model" data-node-kind="cloud" role="group"><rect x="292" y="75" width="112" height="70" rx="8" fill="#332514" stroke="#fcd34d" class="node"/><text x="348" y="104" class="node-title">Model</text><text x="348" y="124" class="node-sub">next step</text></g><g id="node-tools" data-node-id="tools" data-node-label="Tools" data-node-kind="messagebus" role="group"><rect x="292" y="355" width="112" height="70" rx="8" fill="#38211c" stroke="#fdba74" class="node"/><text x="348" y="384" class="node-title">Tools</text><text x="348" y="404" class="node-sub">permitted</text></g><g id="node-review" data-node-id="review" data-node-label="Review" data-node-kind="external" role="group"><rect x="292" y="200" width="112" height="70" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="348" y="229" class="node-title">Review</text><text x="348" y="249" class="node-sub">human decision</text></g></svg>