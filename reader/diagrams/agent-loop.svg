<svg data-theme="dark" data-course-export="compact-readable" viewBox="0 0 420 500" width="420" height="500" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; }
