<svg data-theme="dark" data-course-export="compact-readable" viewBox="0 0 420 740" width="420" height="740" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; }
  .bg { fill: #020617; }
  .grid { stroke: #122033; stroke-width: 1; }
  .frame { fill: rgba(8, 20, 36, .62); stroke: #28405d; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .frame-label { fill: #8aa2b4; font-size: 12px; font-weight: 650; letter-spacing: .04em; }
  .node { stroke-width: 2.2; }
  .node-title { fill: #f8fafc; font-size: 18px; font-weight: 700; text-anchor: middle; }
  .node-sub { fill: #b7c6d8; font-size: 14px; text-anchor: middle; }
  .node-tag { fill: #5eead4; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .edge { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .edge-emphasis { stroke: #2dd4bf; stroke-width: 2.8; }
  .edge-dashed { stroke: #c4b5fd; stroke-dasharray: 7 5; }
  .edge-label { fill: #d7e2ef; font-size: 15px; font-weight: 650; text-anchor: middle; paint-order: stroke; stroke: #020617; stroke-width: 7px; stroke-linejoin: round; }
  .edge-label-emphasis { fill: #5eead4; }
  .edge-label-warning { fill: #fdba74; }
</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" class="grid" fill="none"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="arrow-emphasis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c4b5fd"/></marker></defs><title id="title">From Intent to Accepted Change</title><desc id="desc">Understand, specify, plan, execute, verify, and accept work. A failed verification returns through revision to the plan.</desc><rect width="100%" height="100%" class="bg"/><rect width="100%" height="100%" fill="url(#grid)"/><path data-edge-from="understand" data-edge-to="specify" data-edge-label="" d="M144 104V150" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="specify" data-edge-to="plan" data-edge-label="" d="M144 214V260" class="edge" marker-end="url(#arrow)"/><path data-edge-from="plan" data-edge-to="execute" data-edge-label="" d="M144 324V370" class="edge" marker-end="url(#arrow)"/><path data-edge-from="execute" data-edge-to="verify" data-edge-label="" d="M144 434V480" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><path data-edge-from="verify" data-edge-to="accept" data-edge-label="meets request" d="M144 544V650" class="edge edge-emphasis" marker-end="url(#arrow-emphasis)"/><text x="144" y="600" class="edge-label edge-label-emphasis">meets request</text><path data-edge-from="verify" data-edge-to="revise" data-edge-label="not yet" d="M264 512H300" class="edge edge-dashed" marker-end="url(#arrow-dashed)"/><text x="284" y="468" class="edge-label">not yet</text><path data-edge-from="revise" data-edge-to="plan" data-edge-label="revise plan" d="M350 480V292H264" class="edge edge-dashed" marker-end="url(#arrow-dashed)"/><text x="350" y="360" class="edge-label">revise plan</text><g id="node-understand" data-node-id="understand" data-node-label="Understand" data-node-kind="external" role="group"><rect x="24" y="40" width="240" height="64" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="144" y="69" class="node-title">Understand</text><text x="144" y="89" class="node-sub">goal + constraints</text></g><g id="node-specify" data-node-id="specify" data-node-label="Specify" data-node-kind="backend" role="group"><rect x="24" y="150" width="240" height="64" rx="8" fill="#092c2e" stroke="#5eead4" class="node"/><text x="144" y="179" class="node-title">Specify</text><text x="144" y="199" class="node-sub">definition of done</text></g><g id="node-plan" data-node-id="plan" data-node-label="Plan" data-node-kind="backend" role="group"><rect x="24" y="260" width="240" height="64" rx="8" fill="#092c2e" stroke="#5eead4" class="node"/><text x="144" y="289" class="node-title">Plan</text><text x="144" y="309" class="node-sub">small next step</text></g><g id="node-execute" data-node-id="execute" data-node-label="Execute" data-node-kind="messagebus" role="group"><rect x="24" y="370" width="240" height="64" rx="8" fill="#38211c" stroke="#fdba74" class="node"/><text x="144" y="399" class="node-title">Execute</text><text x="144" y="419" class="node-sub">permitted change</text></g><g id="node-verify" data-node-id="verify" data-node-label="Verify" data-node-kind="external" role="group"><rect x="24" y="480" width="240" height="64" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="144" y="509" class="node-title">Verify</text><text x="144" y="529" class="node-sub">inspect outcome</text></g><g id="node-accept" data-node-id="accept" data-node-label="Accept" data-node-kind="external" role="group"><rect x="24" y="650" width="240" height="64" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="144" y="679" class="node-title">Accept</text><text x="144" y="699" class="node-sub">meets the bar</text></g><g id="node-revise" data-node-id="revise" data-node-label="Revise" data-node-kind="external" role="group"><rect x="300" y="480" width="100" height="64" rx="8" fill="#172338" stroke="#bfdbfe" class="node"/><text x="350" y="509" class="node-title">Revise</text><text x="350" y="529" class="node-sub">replan</text></g></svg>